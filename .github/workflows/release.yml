
name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller
          python -m pytest -q

      - name: Embed version and repository
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "APP_VERSION = '$version'" | Set-Content app/update_config.py
          "GITHUB_REPOSITORY = '${{ github.repository }}'" | Add-Content app/update_config.py

      - name: Build onefile
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MyEletricAssistent --collect-all PySide6 run.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $arquivo = "dist/MyEletricAssistent.exe"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release existente. Atualizando executavel..."

            gh release upload $tag $arquivo --clobber

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          else {
            Write-Host "Criando nova release..."

            gh release create $tag $arquivo `
              --title $tag `
              --generate-notes

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
