name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --windowed --name MyEletricAssistent --collect-all PySide6 run.py
      - uses: actions/upload-artifact@v4
        with:
          name: MyEletricAssistent-Windows
          path: dist/MyEletricAssistent/
